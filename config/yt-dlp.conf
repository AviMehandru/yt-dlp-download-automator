# CONFIG_VERSION: 25
# ONE config file for Linux, macOS and Windows. There used to be a separate
# windows-yt-dlp.conf and linux-yt-dlp.conf; they are merged here, and the
# merge cost nothing because there was in fact only ONE genuinely
# platform-specific line between them (--windows-filenames -- see the note
# further down, where it stays off on all three). Everything else in this
# file is format selection, retry/backoff tuning and output templates, none
# of which has ever had a reason to differ by OS.
#
# This file is also fully username- and path-independent -- no manual
# find-and-replace needed, ever. --download-archive, --paths, and --exec
# used to be hardcoded here (with a literal per-user path, requiring a sed
# pass on setup); they've moved OUT of this file entirely and are now
# passed as CLI arguments by run_ytdlp.ps1, built fresh at invocation time
# from the resolved install root (or an optional custom data root -- see
# run_ytdlp.ps1's -DataRoot parameter). Everything left in this file below
# is static: format selection, retry/backoff tuning, and similar settings
# that never change between runs regardless of where data lives or which OS
# is running it.
--update
# JS runtime for solving YouTube's cipher-decryption JS challenge -- as of
# mid-2026, YouTube requires this for reliable extraction; without it,
# yt-dlp falls back to less reliable client/format combinations, which is
# a common cause of mid-download HTTP 403 errors, not just the "no
# supported JavaScript runtime" warning text itself (see yt-dlp/yt-dlp#14404).
# No --js-runtimes line here anymore -- it needs a real resolved path, and
# deno's install location genuinely does differ per platform
# ($HOME/.local/bin/deno on Linux and macOS, $HOME\.deno\bin\deno.exe on
# Windows). So like --download-archive/--paths/--exec, it moved to
# run_ytdlp.ps1, which probes the known locations and then PATH, and omits
# the flag entirely (with a logged warning) if no runtime is found.
#
# CLIENT SELECTION LIVES IN run_ytdlp.ps1, NOT HERE (CONFIG_VERSION 25).
# There is no --extractor-args player_client line in this file, and there
# should not be one: which YouTube clients are usable depends on whether a
# PO token provider is running RIGHT NOW, which is a per-run fact this
# static file cannot know. run_ytdlp.ps1 decides it once per session and
# passes it on the command line, the same way it already passes
# --download-archive, --paths, --exec and --js-runtimes.
#
# THE HISTORY, kept because it explains the whole design. CONFIG_VERSION
# 23 removed an "-android_vr" exclusion that had briefly been here. The
# exclusion was aimed at a live upstream bug (yt-dlp/yt-dlp#17456) where
# android_vr 403s partway through a download, but a real run showed it
# made things worse, not better: without android_vr the run produced
# "Only images are available for download" -- zero video data, a complete
# failure rather than the partial one it was meant to fix.
#
# The reason for that was only understood later, and it is worse than it
# looked. yt-dlp's unauthenticated defaults are exactly TWO clients:
# android_vr and web_safari. android_vr needs no PO token; web_safari
# needs a GVS one. This pipeline provided no tokens, so excluding
# android_vr did not fall back to a working client -- it fell back to the
# only other default, which was structurally incapable of completing a
# download. The pipeline was effectively single-client, and that one
# client was the one with the open 403 bug.
#
# That is what pot-provider.ps1 fixes. With a token available,
# run_ytdlp.ps1 passes player_client=tv_simply,web_safari,android_vr --
# so android_vr goes back to being a genuine last-resort fallback (it
# fails differently from the other two, which is the point of a fallback)
# instead of the only option. Without a token, run_ytdlp.ps1 passes no
# player_client at all, which reproduces the pre-25 behaviour exactly.
#
# So: do not add a player_client line here, and do not re-add a client
# exclusion here. If you want to change the client order, change
# $script:PotHealthyClients in scripts/pot-provider.ps1, where the
# reasoning for each client's position is written out next to it.
-f bv*+ba/b
--merge-output-format mkv
--keep-video
--write-subs
--write-auto-subs
--sub-langs "en.*"
--embed-subs
--write-thumbnail
# No --convert-thumbnails here anymore (was "png"). It converted the raw
# thumbnail to PNG *in place*, deleting the original bytes -- which meant
# postprocess.ps1's "preserve the original format" step had nothing left to
# preserve and had to re-fetch from info.json's thumbnail URL instead. That
# URL is LIVE, not a snapshot: if the uploader changes the video's
# thumbnail while a long download is still in progress, that late re-fetch
# silently pulls the NEW thumbnail instead of the one actually used for the
# embed. postprocess.ps1 now converts to PNG locally from the untouched
# raw file yt-dlp saves here, so both copies are guaranteed to come from
# the exact same bytes captured at extraction time -- no network call,
# no race window. --embed-thumbnail below still works fine without this:
# yt-dlp's embed postprocessor converts internally as needed regardless of
# --convert-thumbnails.
--embed-thumbnail
--add-metadata
--embed-metadata
# --no-embed-info-json is REQUIRED here, even though --embed-info-json is
# never passed explicitly. --embed-metadata (right above) silently embeds
# the infojson too as a side effect unless this is set -- this is
# documented yt-dlp behavior but easy to miss, since it's not obvious from
# the flag's own name. Without this line, the main pass attaches a
# COMMENT-LESS info.json to the .mkv (filename "info.json"), and then
# postprocess.ps1's later re-embed of the comment-complete version lands
# as a SEPARATE, second attachment ("Info.info.json") rather than
# replacing it -- leaving two different info.json-shaped attachments in
# the same file, with the stale comment-less one still first in the
# stream order. This was caught directly in a real ffprobe/ffmpeg log
# (see stream #0:5 "info.json" already present on the INPUT side of
# postprocess.ps1's own re-embed step, before it had added anything).
--no-embed-info-json
--write-description
--write-info-json
# No --embed-info-json flag needed here explicitly (it's set as
# --no-embed-info-json above, next to --embed-metadata, since that's what
# actually needed overriding). Point stands either way: only a
# comment-less info.json exists at this point in the pipeline (comments
# haven't been fetched yet), so nothing gets embedded until
# postprocess.ps1 does it itself, with ffmpeg directly, after the separate
# comments pass merges into the sidecar info.json below.
--no-write-playlist-metafiles
--embed-chapters
--write-link
# No --write-comments here on purpose: comments are fetched by postprocess.ps1
# in a SEPARATE pass, after this download finishes. Comment fetches on
# popular videos can take 30-60+ minutes, and the video/audio/subtitle
# URLs extracted here are signed with a short expiry -- keeping comments
# out of this pass means those links get used immediately, long before
# they'd have any chance to expire. See yt-dlp/yt-dlp#11849.
--continue
--no-overwrites
--retries infinite
--fragment-retries infinite
--extractor-retries 100
--retry-sleep "extractor:exp=1:30:2"
# Without this, a single subtitle 404 (or similar sub-step failure) aborts
# the ENTIRE video -- including throwing away comments that may have taken
# 30-60+ minutes to fetch beforehand. This downgrades that class of failure
# to a warning (logged, and now also surfaced into video_postprocessing.log)
# so the video, audio, and everything else that *did* succeed is still kept.
--ignore-errors
--sleep-requests 2
--sleep-subtitles 30
--sleep-interval 2
--max-sleep-interval 60
--concurrent-fragments 1
# No --download-archive here anymore -- see the CONFIG_VERSION comment at
# the top of this file. Passed by run_ytdlp.ps1 instead, since its location
# depends on the (possibly custom) data root.
#
# --windows-filenames is deliberately OFF on ALL THREE platforms, and this
# is the one line in this file that ever had a platform-specific answer.
# It is not needed for correctness anywhere: yt-dlp already sanitizes
# filenames for whatever OS it is currently running on, so a Windows run
# produces Windows-legal names without it. What the flag actually does is
# force Windows-style sanitization even when running elsewhere -- stripping
# the characters Windows reserves (: * ? " < > |) and the reserved device
# names (CON, PRN, AUX, NUL, COM1...) from names that Linux and macOS would
# otherwise accept perfectly well.
#
# Turn it ON if the archive has to be readable from Windows regardless of
# which machine wrote it -- an SMB/NAS share mounted by both, an external
# drive moved between them, a dual-boot setup, or syncing one archive
# between a Mac and a PC. The cost is only cosmetic (a video titled
# "Q4: What now?" loses its colon and question mark in the folder name),
# and it is harmless to leave on permanently, so if there is ANY chance of
# the archive being read from Windows, prefer turning it on over
# discovering later that a few hundred folders can't be copied.
# --windows-filenames

# --write-playlist-metafiles is deliberately OFF: it has no sensible
# destination in a per-video path scheme (playlist-level files don't have
# a video id/date/title to fill the folder template with). Playlist/channel
# context is still captured per-video in each manifest.json and urls.json,
# and channel-level assets are handled separately by postprocess.ps1.

# --- Folder structure ---
# IMPORTANT: --paths (-P) only ever accepts a literal, unchanging PATH -- it
# does NOT expand %(uploader).40s / %(title).60s / etc, even though it looks like
# it should. Only -o/--output expands those fields (yt-dlp's own docs call
# -o's argument a "TEMPLATE" and -P's argument a plain "PATH" -- that's the
# whole distinction). No --paths lines live in this file anymore (see the
# CONFIG_VERSION comment at the top) -- run_ytdlp.ps1 passes "home" and
# "temp" on the command line instead, so every bit of per-video foldering
# below (uploader/date/id/title, and which subfolder each file type goes
# in) is still done entirely inside these -o templates, just relative to
# whatever "home" resolves to for this particular run.
#
# The forward slashes below are correct on Windows too -- yt-dlp normalizes
# them to the native separator itself, so there is no need for (and no
# benefit to) a Windows-specific copy of these templates.
#
# .40s / .60s below truncate uploader/title wherever they appear in FOLDER
# names, and this is where the tightest platform constraint in the whole
# pipeline lives. On Linux (ext4) and macOS (APFS) the limits are generous
# -- roughly 4096-byte total paths and 255-byte individual names -- so the
# truncation is a loose safety margin. On Windows it is closer to a real
# necessity: MAX_PATH still caps most paths at 260 characters unless long
# path support is explicitly enabled, and one of these per-video paths adds
# up fast (a 40-char uploader folder, then a second folder repeating
# uploader + " - " + date + " - " + id + " - " + a 60-char title, then
# "Pre-merge streams/Final Video.f137.mp4"). That is why the Windows
# install root stays at the short "C:\yt-dlp" rather than moving under the
# user profile -- see run_ytdlp.ps1's platform block. If you do hit
# MAX_PATH on Windows, the fixes in order of preference are: enable
# long paths (Group Policy, or the LongPathsEnabled registry value), use a
# shorter -DataRoot, or lower the .40s/.60s numbers below.
# The filenames themselves are short, fixed, role-based names (Final
# Video.mkv, Subtitles.en.vtt, etc) rather than repeating the full
# uploader/date/id/title a second time -- the folder already carries that.
# yt-dlp still inserts subtitle language codes and --keep-video's format-id
# suffix automatically before the extension regardless of what base name is
# used here, so "Subtitles.%(ext)s" still becomes "Subtitles.en.vtt",
# "Subtitles.en-orig.vtt", etc, and the kept pre-merge streams still land as
# e.g. "Final Video.f137.mp4" alongside "Final Video.mkv" rather than
# colliding with it.
# (No --trim-filenames: filenames are short, fixed role-based names now --
# Final Video, Subtitles, Description, etc, all under 15 characters -- so
# there's nothing left for a length cap to meaningfully do. This existed
# before that change, when filenames still repeated the full
# uploader/date/id/title a second time, and got missed when that was
# removed. Folder-name length is still bounded separately by the .40s/.60s
# field truncation just above.
-o "%(uploader).40s/%(uploader).40s - %(upload_date)s - %(id)s - %(title).60s/Final files/Final Video.%(ext)s"
-o "subtitle:%(uploader).40s/%(uploader).40s - %(upload_date)s - %(id)s - %(title).60s/Subtitles/Subtitles.%(ext)s"
-o "thumbnail:%(uploader).40s/%(uploader).40s - %(upload_date)s - %(id)s - %(title).60s/Images/Thumbnail.%(ext)s"
# (No "storyboard" template: there is no --write-storyboard option in yt-dlp.
# Storyboards are only obtainable by selecting their sb0/sb1/... formats
# explicitly with -f, which doesn't fit this archival setup, so they're
# skipped rather than half-supported.)
-o "description:%(uploader).40s/%(uploader).40s - %(upload_date)s - %(id)s - %(title).60s/Video metadata/Description.%(ext)s"
-o "infojson:%(uploader).40s/%(uploader).40s - %(upload_date)s - %(id)s - %(title).60s/Video metadata/Info.%(ext)s"
-o "link:%(uploader).40s/%(uploader).40s - %(upload_date)s - %(id)s - %(title).60s/Final files/Link.%(ext)s"
# Any future write-flag with no explicit -o override above simply falls
# back to the default (unprefixed) template, i.e. it lands in Final files
# next to the video -- not ideal categorization, but never an error, and
# still correctly inside that video's own per-video folder.

# --- Post-processing: folder org, manifest, checksums, logs, Final Video sync ---
# No --exec line here anymore either (see the CONFIG_VERSION comment at the
# top) -- run_ytdlp.ps1 builds and passes it on the command line instead,
# since the postprocess.ps1 path depends on the resolved install root and
# needs to be a fully resolved string, not literal text that yt-dlp itself
# would need to expand (yt-dlp config files don't expand ~, $HOME or
# %USERPROFILE% at all -- they're read as plain text, no shell involved --
# which is exactly why this moved to run_ytdlp.ps1's own pwsh invocation
# instead of staying here).
# NOTE for when you look at run_ytdlp.ps1: %(filepath)q is used there (not
# %(filepath)s). Newer yt-dlp versions refuse to expand plain %()s/%()l/etc.
# fields inside --exec commands (only d, i, f, q are allowed) because
# unquoted expansion of untrusted video metadata into a shell command is a
# code-injection risk. %q does its own quoting for the shell, so it is NOT
# wrapped in extra literal quotes there -- and it quotes correctly for the
# platform it is running on, which is what makes one --exec string work on
# all three.
