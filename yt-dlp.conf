# CONFIG_VERSION: 1
--update
-f bv*+ba/b
--merge-output-format mkv
--keep-video
--write-subs
--write-auto-subs
--sub-langs "en.*"
--embed-subs
--write-thumbnail
--write-comments
--add-metadata
--embed-metadata
--embed-info-json
--write-description
--write-info-json
--no-write-playlist-metafiles
--write-storyboard
--embed-chapters
--write-link
--continue
--no-overwrites
--retries infinite
--fragment-retries infinite
--sleep-requests 2
--sleep-subtitles 30
--sleep-interval 2
--max-sleep-interval 60
--concurrent-fragments 1
--download-archive C:/yt-dlp/archive.txt
--windows-filenames

# --write-playlist-metafiles is deliberately OFF: it has no sensible
# destination in a per-video path scheme (playlist-level files don't have
# a video id/date/title to fill the folder template with). Playlist/channel
# context is still captured per-video in each manifest.json and urls.json,
# and channel-level assets are handled separately by postprocess.ps1.

# --- Folder structure ---
# "home" is set to the Miscellaneous folder on purpose: it's the catch-all
# default destination, so any file type yt-dlp doesn't have an explicit
# --paths key for (now or in a future update) still lands somewhere sane
# instead of erroring or cluttering the video's root folder.
--paths "home:C:/yt-dlp/Youtube Videos/Complete Archive/%(uploader)s/%(uploader)s - %(upload_date)s - %(id)s - %(title)s/Miscellaneous"
-o "../Final files/%(uploader)s - %(upload_date)s - %(id)s - %(title)s.%(ext)s"
--paths "temp:../Original files"
--paths "subtitle:../Subtitles"
--paths "thumbnail:../Images"
--paths "storyboard:../Images"
--paths "description:../Video metadata"
--paths "infojson:../Video metadata"

# --- Post-processing: folder org, manifest, checksums, logs, Pure Video copy ---
--exec "after_move:powershell -NoProfile -ExecutionPolicy Bypass -File \"C:/yt-dlp/postprocess.ps1\" -FilePath \"%(filepath)s\""
