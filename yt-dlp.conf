# CONFIG_VERSION: 9
--update
-f bv*+ba/b
--merge-output-format mkv
--keep-video
--write-subs
--write-auto-subs
--sub-langs "en.*"
--embed-subs
--write-thumbnail
--convert-thumbnails png
--embed-thumbnail
--add-metadata
--embed-metadata
--embed-info-json
--write-description
--write-info-json
--no-write-playlist-metafiles
--embed-chapters
--write-link
# No --write-comments here on purpose: comments are fetched by postprocess.ps1
# in a SEPARATE pass, after this download finishes. Comment fetches on
# popular videos can take 30-60+ minutes, and the video/audio/subtitle
# URLs extracted here are signed with a short expiry -- keeping comments
# out of this pass means those links get used immediately, long before
# they'd have any chance to expire. See yt-dlp/yt-dlp#11849.
--continue
--no-overwrites
--retries infinite
--fragment-retries infinite
--extractor-retries 100
--retry-sleep "extractor:exp=1:30:2"
# Without this, a single subtitle 404 (or similar sub-step failure) aborts
# the ENTIRE video -- including throwing away comments that may have taken
# 30-60+ minutes to fetch beforehand. This downgrades that class of failure
# to a warning (logged, and now also surfaced into video_postprocessing.log)
# so the video, audio, and everything else that *did* succeed is still kept.
--ignore-errors
--sleep-requests 2
--sleep-subtitles 30
--sleep-interval 2
--max-sleep-interval 60
--concurrent-fragments 1
--download-archive "C:/yt-dlp/Archive Logs/Logs/archive.txt"
--windows-filenames

# --write-playlist-metafiles is deliberately OFF: it has no sensible
# destination in a per-video path scheme (playlist-level files don't have
# a video id/date/title to fill the folder template with). Playlist/channel
# context is still captured per-video in each manifest.json and urls.json,
# and channel-level assets are handled separately by postprocess.ps1.

# --- Folder structure ---
# IMPORTANT: --paths (-P) only ever accepts a literal, unchanging PATH -- it
# does NOT expand %(uploader)s / %(title)s / etc, even though it looks like
# it should. Only -o/--output expands those fields (yt-dlp's own docs call
# -o's argument a "TEMPLATE" and -P's argument a plain "PATH" -- that's the
# whole distinction). So "home" below is just a static root, and every bit
# of per-video foldering (uploader/date/id/title, and which subfolder each
# file type goes in) is done entirely inside -o templates instead.
--paths "home:C:/yt-dlp/Youtube Videos/Complete Archive"
# temp can't be given a per-video subfolder for the same reason (it's a
# --paths value too), so pre-merge intermediate downloads share one flat
# scratch folder across all videos instead of getting sorted per-video.
# That's fine since they're transient and filenames still won't collide
# (the -o filename template still applies inside temp). Note --keep-video's
# retained pre-merge streams have no dedicated type to redirect either, so
# they end up alongside the merged file in "Final files" rather than a
# separate folder.
--paths "temp:C:/yt-dlp/Youtube Videos/_incomplete"
-o "%(uploader)s/%(uploader)s - %(upload_date)s - %(id)s - %(title)s/Final files/%(uploader)s - %(upload_date)s - %(id)s - %(title)s.%(ext)s"
-o "subtitle:%(uploader)s/%(uploader)s - %(upload_date)s - %(id)s - %(title)s/Subtitles/%(uploader)s - %(upload_date)s - %(id)s - %(title)s.%(ext)s"
-o "thumbnail:%(uploader)s/%(uploader)s - %(upload_date)s - %(id)s - %(title)s/Images/%(uploader)s - %(upload_date)s - %(id)s - %(title)s.%(ext)s"
# (No "storyboard" template: there is no --write-storyboard option in yt-dlp.
# Storyboards are only obtainable by selecting their sb0/sb1/... formats
# explicitly with -f, which doesn't fit this archival setup, so they're
# skipped rather than half-supported.)
-o "description:%(uploader)s/%(uploader)s - %(upload_date)s - %(id)s - %(title)s/Video metadata/%(uploader)s - %(upload_date)s - %(id)s - %(title)s.%(ext)s"
-o "infojson:%(uploader)s/%(uploader)s - %(upload_date)s - %(id)s - %(title)s/Video metadata/%(uploader)s - %(upload_date)s - %(id)s - %(title)s.%(ext)s"
-o "link:%(uploader)s/%(uploader)s - %(upload_date)s - %(id)s - %(title)s/Final files/%(uploader)s - %(upload_date)s - %(id)s - %(title)s.%(ext)s"
# Any future write-flag with no explicit -o override above simply falls
# back to the default (unprefixed) template, i.e. it lands in Final files
# next to the video -- not ideal categorization, but never an error, and
# still correctly inside that video's own per-video folder.

# --- Post-processing: folder org, manifest, checksums, logs, Pure Video copy ---
# NOTE: %(filepath)q is used (not %(filepath)s). Newer yt-dlp versions refuse
# to expand plain %()s/%()l/etc. fields inside --exec commands (only d, i, f,
# q are allowed) because unquoted expansion of untrusted video metadata into
# a shell command is a code-injection risk. %q does its own quoting for the
# shell, so it is NOT wrapped in extra literal quotes here.
--exec "after_move:powershell -NoProfile -ExecutionPolicy Bypass -File \"C:/yt-dlp/scripts/postprocess.ps1\" -FilePath %(filepath)q"
