[package]
name = "ytdl-gui"
version = "0.1.0"
description = "Desktop front end for the yt-dlp archival pipeline"
authors = ["Avi Mehandru"]
license = "MIT"
edition = "2021"
# Tauri 2 needs a recent toolchain. Named explicitly so a too-old rustc fails
# with "requires rustc 1.77" rather than with fifty confusing type errors.
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# The dependency list is deliberately this short.
#
# The rest of this repo has no package manifest at all -- nine executable
# files, no build system, no lockfile to audit. Choosing Tauri already spends
# that principle; spending it further on a dozen convenience crates would make
# the GUI the largest supply-chain surface in a project whose whole point is
# that it has almost none. So: no regex (hand-rolled scanners in archive.rs and
# pipeline.rs), no walkdir (a recursive read_dir), no rand (pid + counter), no
# http client (nothing here talks to the network), no chrono (unix seconds,
# formatted in the frontend).
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Cancelling a run has to kill the whole process tree: ytdl.ps1 starts
# run_ytdlp.ps1 as a child pwsh, which starts yt-dlp, which starts
# postprocess.ps1 and ffmpeg. On unix that means signalling the process group.
# Windows uses taskkill /T and needs nothing here.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
